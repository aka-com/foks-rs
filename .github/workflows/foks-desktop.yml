name: FOKS desktop release

on:
  pull_request:
    paths:
      - 'foks-tauri/**'
      - 'foks-ui/**'
      - 'crates/foks-*/**'
      - 'packaging/foks-desktop/**'
      - 'scripts/**'
      - '.github/workflows/foks-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
  push:
    tags: ['foks-desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-macos:
    name: Validate macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pnpm and locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm run typecheck
          pnpm exec eslint foks-ui dev/foks-mock-parts dev/foks-mock-tools
          pnpm run test:foks-ui
          pnpm run acceptance:foks-ui
      - name: Check desktop Rust boundary
        run: |
          cargo test --locked --release -p foks-agent-proto -p foks-agent-client -p foks-client-app -p foks-agent
          cargo test --locked --release -p foks-desktop -p foks-desktop-app
          cargo clippy --locked --release -p foks-desktop -p foks-desktop-app --all-targets -- -D warnings
          cargo fmt -p foks-desktop -p foks-desktop-app -- --check
      - name: Assemble unsigned application
        run: pnpm run foks:bundle:macos
      - name: Validate application layout
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/foks-desktop.app
          test -x "$app/Contents/MacOS/foks-desktop"
          test -x "$app/Contents/MacOS/foks-agent"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = org.foks.desktop
          test -f "$app/Contents/Resources/icon.icns"
      - name: Run the real managed-agent desktop transcript
        run: pnpm run test:foks-desktop:real-agent

  validate-linux:
    name: Validate Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libpcsclite-dev libwebkit2gtk-4.1-dev
      - name: Install pnpm and locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
      - name: Check frontend and desktop
        run: |
          pnpm run typecheck
          pnpm run test:foks-ui
          pnpm run foks:build:frontend
          cargo test --locked -p foks-agent-proto -p foks-agent-client -p foks-client-app -p foks-agent
          cargo test --locked -p foks-desktop -p foks-desktop-app
          cargo clippy --locked -p foks-desktop -p foks-desktop-app --all-targets -- -D warnings
      - name: Run the real managed-agent desktop transcript
        run: pnpm run test:foks-desktop:real-agent

  macos:
    name: macOS arm64 signed and notarized ZIP
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-macos, validate-linux]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pnpm and locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
      - name: Bind release tag to workspace version
        run: |
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME#foks-desktop-v}" = "$workspace_version"
      - name: Assemble application
        run: pnpm run foks:bundle:macos
      - name: Import signing identity
        env:
          CERTIFICATE_P12_B64: ${{ secrets.FOKS_APPLE_CERTIFICATE_P12_B64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.FOKS_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_B64" && test -n "$CERTIFICATE_PASSWORD"
          keychain="$RUNNER_TEMP/foks-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_P12_B64" | base64 -D > "$RUNNER_TEMP/foks-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/foks-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p')
          test "$(printf '%s\n' "$identity" | grep -c .)" -eq 1
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign application
        run: pnpm run foks:sign:macos
      - name: Notarize and archive application
        env:
          APPLE_ID: ${{ secrets.FOKS_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.FOKS_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.FOKS_APPLE_APP_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#foks-desktop-v}"
          mkdir -p "$RUNNER_TEMP/foks-release"
          scripts/notarize-macos-app.sh \
            target/release/bundle/macos/foks-desktop.app \
            "$RUNNER_TEMP/foks-release/foks-desktop-$version-macos-arm64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foks-desktop-macos
          path: ${{ runner.temp }}/foks-release/*.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64 .deb
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-macos, validate-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes appstream desktop-file-utils libgtk-3-dev libpcsclite-dev librsvg2-bin libwebkit2gtk-4.1-dev
      - name: Install pnpm and locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
      - name: Build Debian package
        run: pnpm run foks:bundle:deb
      - name: Verify Debian contents and dependencies
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#foks-desktop-v}"
          mkdir -p "$RUNNER_TEMP/foks-release"
          deb=$(find target/release/bundle/deb -maxdepth 1 -type f -name 'foks-desktop_*.deb' -print -quit)
          test -n "$deb"
          cp "$deb" "$RUNNER_TEMP/foks-release/foks-desktop-$version-linux-x86_64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = foks-desktop
          depends=$(dpkg-deb -f "$deb" Depends)
          grep -F libwebkit2gtk-4.1-0 <<<"$depends"
          grep -F libpcsclite1 <<<"$depends"
          dpkg-deb -c "$deb" | grep -E '/usr/bin/foks-desktop$'
          dpkg-deb -c "$deb" | grep -E '/usr/bin/foks-agent$'
          dpkg-deb -c "$deb" | grep -E '/usr/share/polkit-1/actions/org.foks.desktop.policy$'
          dpkg-deb -c "$deb" | grep -E '/usr/share/metainfo/org.foks.Desktop.metainfo.xml$'
          deb_root="$RUNNER_TEMP/foks-deb-root"
          mkdir -p "$deb_root"
          dpkg-deb -x "$deb" "$deb_root"
          desktop-file-validate "$deb_root/usr/share/applications/foks-desktop.desktop"
          appstreamcli validate --no-net "$deb_root/usr/share/metainfo/org.foks.Desktop.metainfo.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foks-desktop-linux
          path: ${{ runner.temp }}/foks-release/*.deb
          if-no-files-found: error

  attest:
    name: Checksums and build provenance
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: foks-desktop-*
          path: ${{ runner.temp }}/foks-release
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: ${{ runner.temp }}/foks-release
        run: LC_ALL=C sha256sum *.zip *.deb > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/foks-release/*.zip
            ${{ runner.temp }}/foks-release/*.deb
            ${{ runner.temp }}/foks-release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foks-desktop-checksums
          path: ${{ runner.temp }}/foks-release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish tag artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: foks-desktop-*
          path: ${{ runner.temp }}/foks-release
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ runner.temp }}/foks-release/*.zip
            ${{ runner.temp }}/foks-release/*.deb
            ${{ runner.temp }}/foks-release/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
