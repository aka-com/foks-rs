name: standalone-foks

on:
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/foks-*/**"
      - "packaging/**"
      - "tools/foks-client/**"
      - "tools/foks-protocol-sync/**"
      - "tools/foks-server/**"
      - "tools/foks-v019-oracle/**"
      - ".github/workflows/foks-standalone.yml"
  workflow_dispatch:

concurrency:
  group: standalone-foks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  client:
    name: client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Install Linux client dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libpcsclite-dev
      - name: Test the isolated AKA-free client graph
        run: tools/foks-client/check.sh
      - name: Test macOS Keychain integration
        if: runner.os == 'macOS'
        run: cargo test --locked -p foks-keystore --test native_credential_store -- --ignored
      - name: Test Linux Secret Service integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/foks-secret-service-runtime"
            mkdir -m 700 "$XDG_RUNTIME_DIR"
            mkdir -p "$HOME/.local/share/keyrings"
            printf "%s" "foks-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p foks-keystore --test native_credential_store -- --ignored
          '

  server:
    name: server (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: tools/foks-v019-oracle/go.sum
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Install Linux server dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libpcsclite-dev libwebkit2gtk-4.1-dev
      - name: Fetch the pinned Go protocol module
        working-directory: tools/foks-v019-oracle
        run: go mod download github.com/foks-proj/go-foks@v0.1.9
      - name: Check generated protocol metadata
        run: tools/foks-server/generate-protocol.sh --check --offline
      - name: Test offline Go descriptor and fixture guards
        run: go test -C tools/foks-v019-oracle ./...
      - name: Test the complete isolated FOKS graph
        run: tools/foks-server/check.sh
      - name: Verify the Rust client against Go v0.1.9
        run: tools/foks-v019-oracle/run-live-compat.sh
      - name: Verify OIDC software and hardware clients against Go v0.1.9
        run: tools/foks-v019-oracle/run-sso-compat.sh
      - name: Verify MCP against Rust and Go FOKS services
        run: tools/foks-v019-oracle/run-mcp-compat.sh
      - name: Verify team frames against Go v0.1.9
        run: tools/foks-v019-oracle/run-live-team-compat.sh
      - name: Verify the Go v0.1.9 client against the Rust server
        run: tools/foks-v019-oracle/run-go-client-compat.sh
      - name: Test release client/server lifecycle
        run: tools/foks-server/test-client-server.sh
      - name: Test small-team, restart, capacity, and backup behavior
        run: tools/foks-server/test-small-team.sh
      - name: Verify host-key rotation with pinned Go v0.1.9
        run: tools/foks-v019-oracle/run-host-rotation-compat.sh
