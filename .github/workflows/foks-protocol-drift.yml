name: FOKS protocol drift

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mainline-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            tools/foks-protocol-sync/go.mod
            tools/foks-v019-oracle/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the pinned generated contract
        run: tools/foks-server/generate-protocol.sh --check

      - name: Compare pinned metadata with upstream mainline
        id: drift
        continue-on-error: true
        run: tools/foks-server/diff-upstream-protocol.sh --out-dir artifacts --fail-on-review

      - name: Publish report to the workflow summary
        if: always() && hashFiles('artifacts/mainline-diff.md') != ''
        run: cat artifacts/mainline-diff.md >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foks-protocol-mainline-diff
          path: artifacts/

      - name: Open or update the review issue
        if: steps.drift.outcome == 'failure' && hashFiles('artifacts/mainline-diff.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[protocol-drift] go-foks mainline requires review';
            const fullReport = fs.readFileSync('artifacts/mainline-diff.md', 'utf8');
            const report = fullReport.length > 60000
              ? `${fullReport.slice(0, 60000)}\n\n_Report truncated; download the workflow artifact for the full diff._`
              : fullReport;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            const body = `${report}\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail on review-required drift
        if: steps.drift.outcome == 'failure'
        run: exit 1
