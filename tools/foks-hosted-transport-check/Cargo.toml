[workspace]
resolver = "2"

[package]
name = "foks-hosted-transport-check"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
qualification = ["foks-hosted-transport/qualification"]
test-support = ["qualification", "foks-hosted-transport/test-support"]

[dependencies]
foks-metadata-core = { path = "../../crates/foks-metadata-core", default-features = false, features = ["owned-list"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
foks-hosted-transport = { path = "../../crates/foks-hosted-transport", default-features = false }
