<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FOKS Architectural Mockup</title>
<!--
  FOKS Architectural Mockup — every screen the FOKS desktop app ships, transcribed from
  foks-ui/src (app-root.tsx, shell/*, screens/*, components/*) and linking
  the app's own stylesheets (ui/kit/tokens.css then foks-ui/src/styles/shell.css,
  the design sheet that also draws the fake macOS window), so everything except
  the mock scaffolding is the app as it is. The data is foks-ui/src/fixture.ts,
  the same world the mocked bridge answers from.

  Serve the repo root over http (qmux open rejects paths outside the pane
  cwd):  python3 -m http.server -d . 8133
  then open http://localhost:8133/dev/app-foks.html

  Controls, left: walkthroughs — 29 of them, under four headings, one at a
  time. The chosen flow's steps are a row of numbered circles (the current one
  filled) with ‹ › icon buttons after them; the step's own sentence sits under
  the row, and the ← / → keys step as the icons do, and ↑ / ↓ move to the previous or next walkthrough. Below that, a nested page picker: every group open,
  the current page highlighted, with the id a deep link needs. Controls,
  right: app-wide state above view-specific state; the groups the current page
  does not read are dimmed, disabled and foldable away behind the toggle in
  the panel's title. Under it all, the amber band is the mock talking about
  itself — a state the running app cannot be driven into, say — and the blue
  line is the hint the last action left.

  Deep links: ?page=<id> plus any state key (app-wide bare, view keys bare
  too — the core knows which is which), e.g.

    ?page=all&acme=lapsed                     the lapsed-check-in world
    ?page=alerts&acme=unprobed                a server nobody has checked
    ?page=store-personal&sheet=new-password   a write sheet, open
    ?page=eng-people&sheet=add                the Add someone sheet
    ?page=eng-people&failure=roster           a roster read that failed
    ?page=set-devices&account=acct:personal   Settings, Recovery devices
    ?page=srv-server&profile=acme&status=rollback   a server whose history moved
    ?page=srv-server&profile=lab&applied=added,yes
    ?page=fr-protect&path=own&written=1       first run, phrase committed
    ?flow=first-run-own&step=3                a walkthrough, mid-way
    ?flow=lease-lapsed&step=4                 ditto, and no ?page needed

  Every control writes the address bar, so a state reloads into itself; a
  ?flow= link with no ?page= lands on that step's own page.

  This file is assembled from dev/foks-mock-parts/* by
  dev/foks-mock-tools/assemble.mjs; edit the parts, not this file.
-->
<link rel="stylesheet" href="../ui/kit/tokens.css" />
<link rel="stylesheet" href="../foks-ui/src/styles/shell.css" />
<!-- app.css is loaded too. Its window rules are scoped to `#root`, which this
     page has none of, so the fake `.window` frame survives; what it brings is
     everything shell.css does not draw — the group hero, the roster, tabs, the
     setup checklist, sheets, `.menu-portal`, `.card-select-*`, `.app-lock*`
     and `.app-loading`. Nothing in the parts reproduces those as inline styles.
     Its two unscoped rules (`html,body{height:100%}` and a `body` reset) do
     reach this page, which is what the `height:auto !important` and the body
     block below undo — they are later in the cascade, so they win. -->
<link rel="stylesheet" href="../foks-ui/src/styles/app.css" />
<style>
  /* ------------------------------------------------- mockup scaffolding */
  :root{ --mock-page:#eceef2; --mock-note:#66666f; --mock-panel:#ffffff; }
  [hidden]{ display:none !important; }
  html,body{ height:auto !important; min-height:0; overflow:auto; overscroll-behavior:auto !important; }
  body{
    background:var(--mock-page); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:28px 20px 60px; place-items:unset;
  }
  .mock-head{ width:min(1280px,100%); }
  .mock-head h1{ font-size:1.0625rem; letter-spacing:-.01em; font-weight:700; }

  /* The control deck: flows + pages on the left, state on the right. */
  .mock-controls{
    width:min(1280px,100%);
    display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:14px;
    align-items:stretch;
  }
  .mc-col{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .mc-panel{
    border:1px dashed var(--line-mid); border-radius:10px; padding:10px 12px;
    background:color-mix(in srgb, var(--mock-panel) 55%, transparent);
    display:flex; flex-direction:column; gap:8px; min-width:0;
  }
  /* `grow` used to stretch the panel to the column's height while its
     scroller stayed at 19rem, which left a half-clipped row above a band of
     empty panel. The panel now wraps its scroller snugly and the scroller
     alone is capped. */
  .mc-panel.grow{ min-height:0; }
  .mc-title{ font-size:.71875rem; font-weight:700; color:var(--mock-note); text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mc-title .mc-sub{ font-weight:500; text-transform:none; letter-spacing:0; margin-left:auto; text-align:right; }
  .mc-group{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .mc-group.dim{ opacity:.38; }
  .mc-group.dim .mock-chip{ cursor:not-allowed; }
  .mc-group.dim .mock-chip:hover{ background:var(--btn-bg); }
  .mc-group.dim .mock-chip.on:hover{ background:var(--accent); }
  .mc-label{ font-size:.71875rem; font-weight:650; color:var(--mock-note); min-width:7.5rem; }
  .mc-group.dim .mc-label::after{ content:' · n/a'; font-weight:500; }
  .mock-chip{
    padding:3px 9px; border:1px solid var(--line-mid); border-radius:999px;
    background:var(--btn-bg); color:var(--ink); font:inherit; font-size:.71875rem;
    cursor:pointer; line-height:1.35; white-space:nowrap;
  }
  .mock-chip:hover{ background:var(--hover); }
  .mock-chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .mock-chip.on:hover{ background:var(--accent); }
  .mock-chip.sub{ border-style:dashed; }
  .mc-note{ font-size:.71875rem; color:var(--mock-note); line-height:1.45; }
  .mc-note code{ font-family:ui-monospace,Menlo,monospace; font-size:.6875rem; }
  .mc-divider{ border:0; border-top:1px dashed var(--line-mid); margin:2px 0; }
  .mc-scroll{ overflow:auto; max-height:19rem; display:flex; flex-direction:column; gap:8px; padding-right:2px; }
  /* `over` (set by the core while a scroller has more below the fold) fades the
     last visible row, so a half-cut chip row reads as "scroll me", not as a
     clipped panel. */
  .mc-scroll.over{ -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent); mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent); }
  /* The view panel holds the page's own knobs and — behind the toggle in its
     title — every other page's groups, so it gets more room than the six
     app-wide ones need. Deep enough that a page's own groups never clip. */
  .mc-panel.grow > .mc-scroll{ max-height:34rem; }
  /* A value in the state that no chip in its group matches (a deep link with a
     typo, a draft field, a flow step's free text): the deck shows it rather
     than lighting nothing. */
  .mock-chip.custom{ font-family:ui-monospace,Menlo,monospace; font-size:.6875rem; }
  /* The title-bar toggle that folds the other pages' groups away. */
  .mc-toggle{
    border:1px solid var(--line-mid); border-radius:999px; background:var(--btn-bg);
    color:var(--mock-note); font:inherit; font-size:.6875rem; font-weight:600;
    text-transform:none; letter-spacing:0; padding:2px 8px; cursor:pointer; white-space:nowrap;
  }
  .mc-toggle:hover{ background:var(--hover); }

  /* Flows: walkthrough buttons 1 2 3 ...; the chosen one shows its steps below. */
  .mc-flows{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; flex:1; min-width:0; }
  .mc-flows .mock-chip{ min-width:1.7rem; text-align:center; padding:3px 6px; }
  /* The steps are numbered circles in a row, nothing else: a dozen titles and
     page paths stacked vertically pushed the app frame off the screen, and the
     step that matters is the one whose sentence is already printed beside
     ‹ Previous / Next ›. Each circle keeps its label as `title`/`aria-label`,
     so the text is a hover and a screen reader away, never a row of its own. */
  .mc-steps{ display:flex; flex-flow:row wrap; align-items:center; gap:6px; flex:1; min-width:0; }
  .mc-circles{ display:contents; }
  .mc-step.nav{ font-size:.9rem; font-weight:600; color:var(--ink); }
  .mc-step.nav:disabled{ opacity:.35; cursor:default; }
  .mc-step{
    width:1.6rem; height:1.6rem; padding:0; border-radius:50%;
    display:grid; place-items:center; border:1px solid var(--line-mid);
    background:var(--btn-bg); color:var(--muted);
    font:inherit; font-size:.6875rem; font-weight:700; line-height:1; cursor:pointer;
  }
  .mc-step:hover{ background:var(--hover); }
  .mc-step.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .mc-step.on:hover{ background:var(--accent); }
  /* The ‹ › icons and the key hint sit in the circles' own flex row, so the
     icons stay beside the last circle and only the hint wraps when it must. */
  .mc-stepnav{ display:contents; }
  .mc-step.nav:first-of-type{ margin-left:4px; }
  #mcStepNoteRow .mc-note{ flex:1; min-width:0; }
  .mc-keys{ font-size:.6875rem; color:var(--mock-note); white-space:nowrap; }
  .mc-keys kbd{ font-family:inherit; border:1px solid var(--line-mid); border-radius:4px; padding:0 4px; background:var(--btn-bg); }

  /* The page picker: a button showing the path, and a nested tree popover. */
  .mc-picker{ position:relative; }
  .mc-picker-btn{
    width:100%; display:flex; align-items:center; gap:8px; padding:7px 10px;
    border:1px solid var(--line-mid); border-radius:8px; background:#fff; color:var(--ink);
    font:inherit; font-size:.8125rem; cursor:pointer; text-align:left;
  }
  .mc-picker-btn .crumb{ color:var(--muted); }
  .mc-picker-btn .crumb::after{ content:' › '; }
  .mc-picker-btn .cur{ font-weight:650; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mc-picker-btn .caret{ color:var(--muted); font-size:.7rem; }
  .mc-tree{
    position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:50;
    max-height:24rem; overflow:auto; padding:6px;
    background:#fff; border:1px solid var(--line-mid); border-radius:10px;
    box-shadow:0 12px 34px rgba(0,0,0,.18);
  }
  .mc-tree details{ margin:0; }
  .mc-tree summary{
    list-style:none; cursor:pointer; padding:5px 8px; border-radius:6px; font-size:.75rem;
    font-weight:650; color:var(--ink); display:flex; align-items:center; gap:6px;
  }
  .mc-tree summary::-webkit-details-marker{ display:none; }
  .mc-tree summary::before{ content:'▸'; color:var(--muted); font-size:.7rem; width:.8rem; }
  .mc-tree details[open] > summary::before{ content:'▾'; }
  .mc-tree summary:hover{ background:var(--hover); }
  .mc-tree .lvl{ padding-left:14px; }
  .mc-tree .leaf{
    display:flex; align-items:center; gap:6px; width:100%; padding:5px 8px 5px 22px; border:0;
    border-radius:6px; background:transparent; text-align:left; font:inherit; font-size:.75rem;
    color:var(--ink); cursor:pointer;
  }
  .mc-tree .leaf:hover{ background:var(--hover); }
  .mc-tree .leaf.on{ background:var(--accent); color:#fff; font-weight:600; }
  .mc-tree .leaf .id{ margin-left:auto; font-size:.65rem; color:var(--muted); font-family:ui-monospace,Menlo,monospace; }
  .mc-tree .leaf.on .id{ color:rgba(255,255,255,.75); }
  .mc-pages-quick{ display:flex; flex-wrap:wrap; gap:6px; }
  /* The page id inside a sibling chip: what a deep link needs, and what keeps
     the chip's text distinct from the same words on a button in the frame. */
  .mock-chip .qid{ margin-left:5px; font-family:ui-monospace,Menlo,monospace; font-size:.625rem; opacity:.6; }
  .mock-chip.on .qid{ opacity:.75; }

  .mock-hint{
    width:min(1280px,100%); min-height:1.2em;
    font-size:.75rem; color:var(--accent-ink); transition:opacity .3s ease;
  }

  /* The frame: the app window at the design's 1280×860. shell.css draws the
     fake macOS window (.window); the frame is the containing block for the
     app's fixed-position overlays (sheets, menus, toasts) — a transform does
     that, which is why it is always on. */
  .frame{
    width:min(1280px,100%); height:860px; position:relative; transform:translateZ(0);
    border-radius:12px; overflow:hidden; box-shadow:var(--shadow-sheet);
    background:var(--main-surface);
  }
  .frame > .window{ width:100%; height:100%; max-width:none; max-height:none; border:0; border-radius:0; box-shadow:none; margin:0; }
  /* app.css's titlebar nudges are scoped to #root > .window; repeat them here. */
  .frame > .window > .titlebar .brand{ transform:translateY(1px); }
  .frame > .window > .titlebar > .agent{ margin-right:.25rem; transform:translateY(1px); }
  .frame > .window > .titlebar > .global-refresh{ transform:translateY(1px); }
  .frame #overlays{ position:absolute; inset:0; pointer-events:none; z-index:40; }
  .frame #overlays > *{ pointer-events:auto; }
  .mock-band{
    width:min(1280px,100%); padding:8px 12px; border-radius:8px; font-size:.75rem; line-height:1.5;
    background:color-mix(in srgb,#f5a400 12%,#fff); border:1px solid color-mix(in srgb,#d98b00 40%,var(--line));
  }
</style>
</head>
<body>
<div class="mock-head">
  <h1>FOKS Architectural Mockup</h1>
</div>

<div class="mock-controls" aria-label="Mockup controls">
  <div class="mc-col">
    <div class="mc-panel" id="mcFlows">
      <div class="mc-title">Walkthroughs <span class="mc-sub" id="mcFlowSub"></span></div>
      <div class="mc-group"><span class="mc-label">Walkthrough</span><div class="mc-flows" id="mcFlowList"></div></div>
      <hr class="mc-divider" id="mcFlowRule" hidden />
      <div class="mc-group" id="mcStepsRow" hidden><span class="mc-label" aria-hidden="true"></span>
        <div class="mc-steps"><span class="mc-circles" id="mcSteps"></span>
        <span class="mc-stepnav" id="mcStepNav">
          <button class="mc-step nav" data-act="flow-prev" title="Previous step" aria-label="Previous step">‹</button>
          <button class="mc-step nav" data-act="flow-next" title="Next step" aria-label="Next step">›</button>
          <span class="mc-keys" title="From anywhere outside a text field: ← → step this walkthrough, ↑ ↓ move to the previous or next one."><kbd>←</kbd> <kbd>→</kbd> steps · <kbd>↑</kbd> <kbd>↓</kbd> flows</span>
        </span></div>
      </div>
      <div class="mc-group" id="mcStepNoteRow" hidden><span class="mc-label" aria-hidden="true"></span><span class="mc-note" id="mcStepNote"></span></div>
    </div>
    <div class="mc-panel grow" id="mcPages">
      <div class="mc-title">Page <span class="mc-sub" id="mcPageSub"></span></div>
      <div class="mc-picker" id="mcPicker">
        <button class="mc-picker-btn" id="mcPickerBtn" aria-haspopup="tree" aria-expanded="false"></button>
        <div class="mc-tree" id="mcTree" hidden></div>
      </div>
      <div class="mc-pages-quick" id="mcPagesQuick"></div>
      <div class="mc-note" id="mcPageNote"></div>
    </div>
  </div>
  <div class="mc-col">
    <div class="mc-panel" id="mcApp">
      <div class="mc-title">App-wide state</div>
      <div class="mc-scroll" id="mcAppGroups"></div>
    </div>
    <div class="mc-panel grow" id="mcView">
      <div class="mc-title">View state
        <button class="mc-toggle" id="mcDimToggle" aria-expanded="true" hidden></button>
      </div>
      <div class="mc-scroll" id="mcViewGroups"></div>
    </div>
  </div>
</div>
<div class="mock-hint" id="hint"></div>
<div class="mock-band" id="mockBand" hidden></div>

<div class="frame" id="frame">
  <div class="window web-mock-window" id="win"></div>
  <div id="overlays"></div>
</div>

<script>
(function () {
  'use strict';

  /* ======================================================== 10-core.js */
  /* ------------------------------------------------------------- the core
     M is the mock runtime. Parts register pages, flows, app-wide state groups
     and data on it; the core owns the state object, the control deck, the
     address bar and the render loop.

       M.s                       the state: { page, <app keys…>, v: { <view keys…> } }
       M.app({key,label,values,note})     an app-wide state group (right, top)
       M.page({id,title,path,nav,controls,render,overlay,note,side,titlebar,frameless})
       M.flow({id,title,steps:[{label,page,set,note}]})
       M.set(key, value)         'lease' or 'v.sheet'; re-renders and writes the URL
       M.go(pageId, patch)       navigate, optionally patching state first
       M.toast(text)             a toast in the app's toast stack
       M.hint(text)              the line under the controls
       M.showDim                 deck preference: are other pages' state groups
                                 listed? (localStorage `foksMockDim`)
       M.fns.name = fn           handlers for data-act="call" data-fn="name" data-arg="…"
       M.esc, M.icon, M.h        helpers

     Markup conventions for anything the renderers emit:
       data-act="set" data-key="v.kind" data-val="Password"   set a key
       data-act="go"  data-page="eng-people" [data-set='{"v.tab":"people"}']
       data-act="call" data-fn="removeItem" data-arg="…"
       data-act="toast" data-text="…"
     A value of "" via data-val clears the key (null). */

  var M = window.FOKS_MOCK = {
    s: { page: 'all', v: {} },
    pages: {}, pageOrder: [], flows: [], flowOrder: [], appGroups: [],
    fns: {}, data: {}, icons: {},
    currentFlow: null, step: 0,
    /* The deck's own preference: are the other pages' (dimmed) state groups
       listed? Open by default, remembered per browser rather than in the URL —
       a deep link should describe the app, not the deck. */
    showDim: true,
  };
  try { M.showDim = localStorage.getItem('foksMockDim') !== 'hidden'; } catch (e) { /* file:// */ }

  /* ------------------------------------------------------------ helpers */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  M.esc = esc;
  /* Join html fragments, dropping falsy ones. */
  M.h = function () {
    var out = '';
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      if (Array.isArray(a)) out += M.h.apply(null, a);
      else if (a) out += a;
    }
    return out;
  };
  /* <Icon name size /> as components/icon.tsx emits it: an svg.ic with the
     shell's stroke defaults; the paths come from M.icons (20-data.js). */
  M.icon = function (name, size, extra) {
    var body = M.icons[name];
    if (!body) return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" data-missing-icon="' + esc(name) + '"></svg>';
    var attrs = 'class="ic' + (extra && extra.cls ? ' ' + extra.cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
    if (size) attrs += ' width="' + size + '" height="' + size + '"';
    return '<svg ' + attrs + '>' + body + '</svg>';
  };
  var hintTimer = null;
  M.hint = function (text) {
    var el = document.getElementById('hint');
    el.textContent = text || '';
    el.style.opacity = 1;
    clearTimeout(hintTimer);
    if (text) hintTimer = setTimeout(function () { el.style.opacity = 0; }, 6000);
  };
  M.toasts = [];
  var toastSeq = 0;
  /* ui/kit/toasts.tsx's two constants, to the millisecond: a toast lives
     DEFAULT_DURATION_MS, then drops `.show` (the CSS transition out) and is
     removed EXIT_DURATION_MS later. So a toast is on screen for 2.6s and
     fading for a further 0.3s — not one 4.2s pill. An actionable toast with no
     explicit durationMs is persistent (toasts.tsx:88-92): it waits for the
     action or the dismiss button. Five at most (MAX_VISIBLE_TOASTS), oldest
     dropped, and a repeat of the same message revives the entry in place
     rather than stacking a second one (the dedupeKey path). */
  M.TOAST_MS = 2600;
  M.TOAST_EXIT_MS = 300;
  M.TOAST_MAX = 5;
  M.toast = function (text, opts) {
    opts = opts || {};
    var key = opts.dedupeKey || text;
    var live = M.toasts.filter(function (t) { return (t.dedupeKey || t.text) === key; })[0];
    var entry;
    if (live) {
      clearTimeout(live.timer); clearTimeout(live.exitTimer);
      entry = live;
      entry.text = text; entry.tone = opts.tone === 'warning' ? 'warning' : 'info';
      entry.action = opts.action || null; entry.show = true;
    } else {
      entry = {
        id: ++toastSeq, text: text, dedupeKey: opts.dedupeKey || null,
        tone: opts.tone === 'warning' ? 'warning' : 'info', action: opts.action || null, show: true,
      };
      M.toasts.push(entry);
      /* MAX_VISIBLE_TOASTS: `.slice(-5)` drops the oldest. */
      while (M.toasts.length > M.TOAST_MAX) { var gone = M.toasts.shift(); clearTimeout(gone.timer); clearTimeout(gone.exitTimer); }
    }
    var persistent = entry.action && opts.durationMs === undefined;
    if (!persistent) {
      var ms = Math.max(0, opts.durationMs === undefined ? M.TOAST_MS : opts.durationMs);
      entry.timer = setTimeout(function () { entry.show = false; renderOverlays(); }, ms);
      entry.exitTimer = setTimeout(function () { M.dismissToast(entry.id); }, ms + M.TOAST_EXIT_MS);
    }
    renderOverlays();
    return entry.id;
  };
  M.dismissToast = function (id) {
    M.toasts = M.toasts.filter(function (t) {
      if (String(t.id) === String(id)) { clearTimeout(t.timer); clearTimeout(t.exitTimer); return false; }
      return true;
    });
    renderOverlays();
  };
  M.fns.toastDismiss = function (id) { M.dismissToast(id); };
  M.fns.toastAction = function (id) {
    var t = M.toasts.filter(function (x) { return String(x.id) === String(id); })[0];
    try { if (t && t.action && t.action.onAction) t.action.onAction(); } finally { M.dismissToast(id); }
  };

  /* ---------------------------------------------------------- registry */
  M.app = function (group) {
    if (!group.key) throw new Error('app group needs a key');
    M.appGroups = M.appGroups.filter(function (g) { return g.key !== group.key; });
    M.appGroups.push(group);
    if (M.s[group.key] === undefined) M.s[group.key] = group.values[0].v;
    return group;
  };
  M.page = function (page) {
    if (!page.id) throw new Error('page needs an id');
    if (!M.pages[page.id]) M.pageOrder.push(page.id);
    page.path = page.path || [page.title];
    page.controls = page.controls || [];
    M.pages[page.id] = page;
    return page;
  };
  M.flow = function (flow) {
    if (!M.flows.some(function (f) { return f.id === flow.id; })) M.flowOrder.push(flow.id);

     so a drag that starts inside the sheet and ends over the backdrop does
     not close it. The click that follows lands on whatever the re-render put
     under the pointer, which is never the (now gone) backdrop. */
  document.addEventListener('mousedown', function (ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains('backdrop') || !t.getAttribute('data-act')) return;
    if (ev.button !== 0) return;
    ev.preventDefault();

  function runAct(t, ev) {
    var act = t.getAttribute('data-act');

    else if (act === 'call') { var fn = M.fns[t.getAttribute('data-fn')]; if (fn) fn(t.getAttribute('data-arg'), t, ev); }
    else if (act === 'go') { var patch = t.getAttribute('data-set'); M.go(t.getAttribute('data-page'), patch ? JSON.parse(patch) : null); }
  }
  document.addEventListener('click', function (ev) {
    if (ev.target && ev.target.classList && ev.target.classList.contains('backdrop') && ev.target.__dismissed) return;
    var t = ev.target.closest('[data-act]');
    var picker = document.getElementById('mcPicker');
    if (!ev.target.closest('#mcPicker')) {
      document.getElementById('mcTree').hidden = true;
      document.getElementById('mcPickerBtn').setAttribute('aria-expanded', 'false');
    }
    if (ev.target.closest('#mcPickerBtn')) {
      var tree = document.getElementById('mcTree');
      tree.hidden = !tree.hidden;
      document.getElementById('mcPickerBtn').setAttribute('aria-expanded', String(!tree.hidden));
      /* Open on the current page: the tree is 40-odd leaves deep. */
      if (!tree.hidden) {
        var here = tree.querySelector('.leaf.on');
        if (here) tree.scrollTop = Math.max(0, here.offsetTop - tree.offsetTop - tree.clientHeight / 2);
      }
      return;
    }
    if (!t || t.disabled) return;
    var act = t.getAttribute('data-act');
    if (act === 'set') {
      M.set(t.getAttribute('data-key'), t.getAttribute('data-val'));
    } else if (act === 'go') {
      var patch = t.getAttribute('data-set');
      M.go(t.getAttribute('data-page'), patch ? JSON.parse(patch) : null);
      document.getElementById('mcTree').hidden = true;
    } else if (act === 'call') {
      var fn = M.fns[t.getAttribute('data-fn')];
      if (fn) fn(t.getAttribute('data-arg'), t, ev); else M.hint('No handler "' + t.getAttribute('data-fn') + '".');
    } else if (act === 'stop') {
      /* a panel shielding its backdrop's close hook */
    } else if (act === 'toast') {
      M.toast(t.getAttribute('data-text'));
    } else if (act === 'hint') {
      M.hint(t.getAttribute('data-text'));
    } else if (act === 'flow') {
      var id = t.getAttribute('data-flow');
      if (M.currentFlow && M.currentFlow.id === id) M.stopFlow(); else M.startFlow(id, 0);
    } else if (act === 'dim-toggle') {
      M.showDim = !M.showDim;
      try { localStorage.setItem('foksMockDim', M.showDim ? 'shown' : 'hidden'); } catch (e) { /* file:// */ }
      renderControls();
    } else if (act === 'flow-step') {
      M.step = parseInt(t.getAttribute('data-step'), 10); applyStep();
    } else if (act === 'flow-prev') M.flowStep(-1);
    else if (act === 'flow-next') M.flowStep(1);
    else if (act === 'flow-stop') M.stopFlow();
    if (t.closest('#mcTree')) { /* keep the tree open only for summaries */ }
  });

    if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;

    else if (M.currentFlow && ev.key === 'ArrowLeft') { M.flowStep(-1); ev.preventDefault(); }

    unavailable: { server: 'ok', lease: { state: 'fresh', expires_in: '12 d' }, catalog: true },
    unprobed: { server: 'never-probed', lease: null },
    blocked: { server: 'blocked', lease: { state: 'fresh', expires_in: '12 d' } },
  };

  function unavailableSubject(store) {
    return store.kind === 'team'
      ? 'Items and members in ' + store.name + ' are unavailable'
      : 'Items in ' + store.name + ' are unavailable';
  }
  /* screens/store-access.tsx:27-71, verbatim. */
  function accessCopy(state, store, serverName) {
    var subject = unavailableSubject(store);
    switch (state) {
      case 'blocked':
        return { title: 'Server access blocked', detail: 'A security verification failed for ' + serverName + '. ' + subject + '.', action: 'Review server', actionKind: 'review-server' };
      case 'lease-unavailable':
        return { title: 'Server status unavailable', detail: 'Cannot verify server status for ' + serverName + '. ' + subject + '.', action: 'Review server', actionKind: 'review-server' };
      case 'never-probed':
        return { title: 'Server not checked yet', detail: serverName + ' has not been checked. ' + subject + ' until it is verified.', action: 'Review server', actionKind: 'review-server' };
      case 'catalog-unavailable':
        return { title: 'Store connection failed', detail: 'The server connection for ' + store.name + ' could not be established. ' + subject + '.', action: 'Review server', actionKind: 'review-server' };
      case 'lease-lapsed':
        return { title: 'Check-in expired', detail: subject + ' until FOKS reconnects to ' + serverName + '.', action: 'Open server', actionKind: 'open-server' };
      case 'inactive':
        return { title: 'Group setup incomplete', detail: 'Items and members are unavailable until setup is finished.', action: 'Finish setup', actionKind: 'finish-setup' };
      default:
        return null;
    }
  }

  D.world = function (s) {
    s = s || M.s;
    var acme = ACME[s.acme] || ACME.ok;
    var unavailable = acme.catalog ? ['acct:work', 'team:eng'] : D.unavailableStores.slice();

    var servers = D.servers.map(function (srv) {
      if (srv.id !== 'acme') return { id: srv.id, name: srv.name, label: srv.label, host_id: srv.host_id, chain: srv.chain, epoch: srv.epoch, lease: srv.lease, accounts: srv.accounts, state: srv.state };
      return { id: srv.id, name: srv.name, label: srv.label, host_id: srv.host_id, chain: srv.chain, epoch: srv.epoch, lease: acme.lease, accounts: srv.accounts, state: acme.server };
    });
    var serverById = {};
    servers.forEach(function (srv) { serverById[srv.id] = srv; });

    var stores = D.stores.map(function (store) {
      var srv = serverById[store.server];
      var state = 'normal';
      if (srv && srv.state === 'blocked') state = 'blocked';
      else if (srv && srv.state === 'lease-unavailable') state = 'lease-unavailable';
      else if (srv && srv.state === 'lease-lapsed') state = 'lease-lapsed';
      else if (srv && srv.state === 'never-probed') state = 'never-probed';
      else if (unavailable.indexOf(store.id) >= 0) state = 'catalog-unavailable';
      else if (store.kind === 'team' && !store.active) state = 'inactive';

      var parties = D.partiesOf(store.id);
      /* lease.ts:119-141. A group whose roster or federation could not be read
         says so in place of its people count, and storeHeadingDescription
         drops every failing reading — the pane under the heading already
         explains it, so the heading does not say it twice. */
      var rosterFailed = !!D.groupDetailFailure(store.id, 'roster');
      var fedFailed = !!D.groupDetailFailure(store.id, 'federation');
      var description;
      if (state === 'inactive') description = 'Setup incomplete';
      else if (state !== 'normal') description = 'Connection error';
      else if (store.kind === 'account') description = srv ? srv.name : '';
      else if (rosterFailed) description = 'Roster unavailable';
      else if (fedFailed) description = 'Federation unavailable';
      else description = D.peopleGroups(parties);

      var out = {
        id: store.id, kind: store.kind, name: store.name, alias: store.alias,
        server: store.server, account: store.account, active: store.active,
        team_kind: store.team_kind, team_id_hex: store.team_id_hex,
        state: state,
        description: description,
        heading: (state === 'normal' && !rosterFailed && !fedFailed) ? description : '',
        failure: rosterFailed ? (fedFailed ? 'both' : 'roster') : (fedFailed ? 'federation' : null),
        readable: unavailable.indexOf(store.id) < 0 && !!srv && srv.state === 'ok' &&
          (store.kind !== 'team' || store.active),
        serverName: srv ? srv.name : store.server,
        parties: parties,
        notice: null,
      };
      if (state !== 'normal') {
        var copy = accessCopy(state, out, out.serverName);
        out.notice = {
          severity: state === 'inactive' ? 'warn' : 'crit',
          title: copy.title, detail: copy.detail,
          action: copy.action, actionKind: copy.actionKind,
          profile: store.server,
        };
      }
      return out;
    });
    var storeById = {};
    stores.forEach(function (store) { storeById[store.id] = store; });

    /* storeAccessBands: one band per state:server bucket. `inactive` never
       produces a band — it stays on the group. */
    var order = [], buckets = {};
    stores.forEach(function (store) {
      if (store.state === 'normal' || store.state === 'inactive') return;
      var key = store.state + ':' + store.server;
      if (!buckets[key]) { buckets[key] = { state: store.state, stores: [] }; order.push(key); }
      buckets[key].stores.push(store);
    });
    var bands = order.map(function (key) {
      var bucket = buckets[key];
      var names = bucket.stores.map(function (st) { return st.name; });
      var joined = names.length < 2 ? (names[0] || '')
        : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
      var verb = bucket.stores.length === 1 ? 'is' : 'are';
      var serverName = bucket.stores[0].serverName;
      var text =
        bucket.state === 'blocked' ? joined + ' ' + verb + ' unavailable because security verification failed for ' + serverName + '.'
        : bucket.state === 'lease-unavailable' ? joined + ' ' + verb + ' unavailable because server status could not be verified for ' + serverName + '.'
        : bucket.state === 'lease-lapsed' ? joined + ' ' + verb + ' unavailable because the connection to ' + serverName + ' expired.'
        : bucket.state === 'catalog-unavailable' ? joined + ' ' + verb + ' unavailable because the latest item list could not be loaded.'

      /* StoreAccessBand is { key, text } and nothing more: items-screen.tsx:534
         renders `<Band>{band.text}</Band>` with no severity, so the class is
         plain `band` (amber), NOT `band stop`. */
      return { key: key, text: text };
    });

    var items = D.items.filter(function (item) {
      return item.kind !== 'Folder' && storeById[item.store] && storeById[item.store].readable;
    });

    var leaseState = acme.server === 'lease-lapsed' ? 'lapsed'
      : acme.server === 'lease-unavailable' ? 'unavailable' : 'fresh';
    /* notesNow(world) — the fixture's three notes, minus the lapse entry
       unless the world is lapsed (model/lease.ts:228).

       The other stopped worlds (`checkin-unavailable`, `unprobed`, `blocked`)
       are the deck's own: the app can only be driven between fresh and lapsed,
       and its ?state= presets never touch a server's state. Since this file
       builds those worlds by hand, it also builds the note the bridge would
       have attached to one — bridge.ts:1706-1745 gives every state that hides
       a server's stores a crit note, `never-probed` included. Same id shape
       (`${state}-${id}`), same title, same detail, and first in the list, as
       notificationsOf emits the server notes before the catalog failures.
       72-alerts treats only `catalog-` ids as actionable, so the button is
       inert — which is right: none of these is a thing this window can fix. */
    var STOPPED_NOTE = {
      'lease-unavailable': { detail: 'The agent has no signed check-in for this server. Its stores are hidden until it gets one.', action: 'Inspect' },
      blocked: { detail: 'The server’s history no longer matches what this Mac pinned. Its stores are hidden. Open the server to see the reported error.', action: 'Inspect' },
      'never-probed': { detail: 'This server has not been checked. Its stores are hidden until it is checked and its identity pinned.', action: 'Check' },
    };
    var alerts = D.alerts.filter(function (n) { return n.id !== 'lease-acme' || leaseState === 'lapsed'; });
    var stopped = STOPPED_NOTE[acme.server];
    if (stopped) {
      alerts = [{
        id: acme.server + '-acme', severity: 'crit',
        title: serverById.acme.name + ' is locked',
        detail: stopped.detail, action: stopped.action,

    /* The catalog-failed world (`acme=unavailable`): notificationsOf pushes
       one note per catalog failure after the server notes (bridge.ts:1745-
       1757) — `catalog-store-<i>`, `warn` when not fatal, action `Retry` when
       retryable. This is the one alert the pane can act on. The message is the
       store takeover's own sentence; the app's bridge never produces this
       world, so there is no captured string to copy. */
    if (acme.catalog) {

        return {
          id: 'catalog-store-' + i, severity: 'warn',
          title: 'Could not list one store on acme',
          detail: (storeById[ref] ? storeById[ref].name : ref) + ' could not be listed: the server connection could not be established.',
          action: 'Retry',
        };
      }));
    }

    var nav = D.storeNavigationOrder(stores);
    return {
      acme: s.acme || 'ok',
      leaseState: leaseState,
      agent: { phase: s.agent === 'starting' ? 'Bootstrap' : 'Ready' },
      servers: servers,
      serverById: serverById,
      unavailableStores: unavailable,
      stores: stores,
      storeById: storeById,
      navOrder: nav,
      vaults: nav.filter(function (st) { return st.kind === 'account'; }),
      groups: nav.filter(function (st) { return st.kind === 'team' && st.team_kind === 'named'; }),
      shares: nav.filter(function (st) { return st.kind === 'team' && st.team_kind === 'adhoc'; }),
      items: items,
      bands: bands,
      alerts: alerts,
      alertCount: alerts.length,
    };
  };

  /* ----------------------------------------------------- derived facts

  D.captions = {
    fresh: { 'acct:personal': 'foks.example.net', 'acct:work': 'foks.acme-corp.com', 'team:eng': '5 people · 1 group', 'team:household': '2 people', 'team:homelab': 'Setup incomplete' },
    lapsed: { 'acct:personal': 'foks.example.net', 'acct:work': 'Connection error', 'team:eng': 'Connection error', 'team:household': '2 people', 'team:homelab': 'Setup incomplete' },

      'team:eng|/deploy/staging-token': D.readersOf(D.itemAt('team:eng', '/deploy/staging-token')).length,
      'team:eng|/release/bundle.tar': D.readersOf(D.itemAt('team:eng', '/release/bundle.tar')).length,
      'team:household|/wifi/guest-password': D.readersOf(D.itemAt('team:household', '/wifi/guest-password')).length,
    },
    engineering: D.peopleGroups(D.partiesOf('team:eng')),   /* "5 people · 1 group" */
    household: D.peopleGroups(D.partiesOf('team:household')), /* "2 people" */
    alertBadge: { fresh: 2, lapsed: 3 },

  /* ======================================================== 30-shell.js */
  /* ----------------------------------------------------------- 30-shell.js
     The window chrome every page shares, and the component helpers that emit
     the app's own DOM (world.md §5).

       M.renderTitlebar(s, page)   .titlebar — lights, FOKS, spacer, agent pill,
                                   the global refresh button.
       M.renderSidebar(s, page)    nav.side — All items / Vaults / Groups /
                                   Shares / footer. `page.nav` says which row
                                   is on: a StoreRef, or 'all' | 'alerts' |
                                   'settings' | 'setup'.
       M.globalTakeover(s)         the boot loading/error screens and the
                                   agent-lost .stopwrap, as a render() result —
                                   or null. EVERY page renderer starts with:

                                       render: function (s) {
                                         var t = M.globalTakeover(s);
                                         if (t) return t;
                                         …
                                       }

     ------------------------------------------------------------------ M.ui

     | helper | signature | example |

     | `avatar` | `avatar(party, o{className})` — `className` defaults to `av`, the panel roster passes `pav` | `M.ui.avatar(p)` |
     | `stack` | `stack(parties, o{size:'md'\|'lg'\|'xs', title})` — first two only | `M.ui.stack(store.parties)` |
     | `kindIcon` | `kindIcon(kind, className)` | `M.ui.kindIcon('Password','md')` |
     | `kindGlyph` | `kindGlyph(item, size)` — a `/logins/` password becomes the site initial | `M.ui.kindGlyph(item,'big')` |
     | `inset` | `inset(rowsHtml, o{variant:'field'\|'preview', off, className})` | `M.ui.inset(rows)` |
     | `insetRow` | `insetRow(o{label, value, valueClass, action, className, variant, forId, attrs})` | `M.ui.insetRow({label:'Password', value:'…', valueClass:'mono'})` |
     | `field` | `field(o{label, value, type, placeholder, mono, hint, action, bind, id, attrs})` — an InsetRow with a controlled input | `M.ui.field({label:'Name', value:'', bind:'v.name'})` |

     | `listRow` | `listRow(o{item, storeName, server, selected, attrs, searching})` — the `.row` of items-screen; `storeName` defaults to `M.data.whereOf(item)` | |

     | `emptyState` | `emptyState(o{kind, title, body, action})` / `emptySearch(o{store, query})` | |
     | `body` | `body(inner, o{className})` — `.body` | |

     `menuButton` example (an open menu is view state, not a component state):

       M.ui.menuButton({
         label:'New', menuLabel:'What to create', align:'start', variant:'primary',
         open: s.v.menu === 'new',
         openAttrs:'data-act="set" data-key="v.menu" data-val="new"',
         closeAttrs:'data-act="set" data-key="v.menu" data-val=""',
         menuHtml: M.data.KIND_LIST.map(function (k) {
           return '<button type="button" role="menuitem" class="kind-menu-item" ' +
                  'data-act="set" data-key="v.sheet" data-val="new-' + k.toLowerCase() + '">' +
                  M.ui.kindIcon(k) + M.esc(M.data.kindLabel(k)) + '</button>';
         }).join(''),

  var UI = (M.ui = {});
  var esc = M.esc;
  var uid = 0;
  function nextId(prefix) { uid += 1; return (prefix || 'm') + uid; }

  function attr(name, value) {
    return value === undefined || value === null || value === false ? '' : ' ' + name + '="' + esc(value) + '"';
  }
  function raw(extra) { return extra ? ' ' + extra : ''; }
  function classes() {
    var out = [];
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) out.push(arguments[i]);
    return out.join(' ');
  }

  /* ------------------------------------------------------------- Button
     components/button.tsx spreads `...rest` FIRST and then writes `type`,
     `className` and `aria-pressed` itself, so the serialized order is

       …rest…  type  class  aria-pressed

     and `rest` is whatever the call site passed, in its own order. The app's
     call sites overwhelmingly read `disabled`, `title`, `aria-label`, so that
     is the order here; `attrs` (the mock's data-act hook, plus aria-haspopup /
     aria-expanded, which the app also passes through rest) goes last inside
     rest. `ariaFirst:true` swaps title and aria-label for the one call site
     that writes them the other way round (the titlebar refresh). */
  var VARIANT_CLASS = { primary: 'primary', plain: '', danger: 'danger', quiet: 'icon' };
  UI.btn = function (label, o) {
    o = o || {};
    var cls = ['btn', VARIANT_CLASS[o.variant || 'plain'], o.size === 'sm' ? 'cap' : '', o.on ? 'on' : '', o.className || '']
      .filter(Boolean).join(' ');
    /* `rest` is serialized in the caller's own order, so `disabled` sits where
       that call site puts it: after the labels for the titlebar refresh
       (app-root.tsx:611-623, the `ariaFirst` call site), before them elsewhere. */
    var dis = o.disabled ? ' disabled=""' : '';
    var labels = o.ariaFirst
      ? attr('aria-label', o.ariaLabel) + attr('title', o.title) + dis
      : dis + attr('title', o.title) + attr('aria-label', o.ariaLabel);
    return '<button' + labels + raw(o.attrs) +
      ' type="' + (o.type || 'button') + '" class="' + cls + '"' +
      (o.on === undefined ? '' : ' aria-pressed="' + (o.on ? 'true' : 'false') + '"') + '>' +
      (o.icon ? M.icon(o.icon) : '') + (label == null ? '' : label) + '</button>';
  };

  /* -------------------------------------------------- Chip / Tag / Badge */
  UI.chip = function (text, o) {
    o = o || {};
    var cls = ['chip', (o.tone && o.tone !== 'default') ? o.tone : '', o.className || ''].filter(Boolean).join(' ');
    return '<span class="' + cls + '"' + attr('title', o.title) + raw(o.attrs) + '>' + (text == null ? '' : text) + '</span>';
  };
  UI.tag = function (text, o) {
    o = o || {};
    return '<span class="' + (o.tone === 'warn' ? 'tag warn' : 'tag') + '"' + attr('title', o.title) + '>' + text + '</span>';
  };
  /* Nothing at zero — the rule that an empty Alerts badge is absent, not "0". */
  UI.badge = function (count, label) {
    if (!count) return '';
    return '<span class="badge"' + attr('title', label) + '>' + esc(count) + '</span>';
  };

  /* ------------------------------------------------------ Avatar / Stack
     React sets `style` through the CSSOM, so the app's serialized DOM carries
     `rgb(162, 132, 94)` where the palette says `#a2845e`. Normalise, so a
     capture of the mock diffs clean against a capture of the app. */
  UI.rgb = function (hex) {
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    return m ? 'rgb(' + parseInt(m[1], 16) + ', ' + parseInt(m[2], 16) + ', ' + parseInt(m[3], 16) + ')' : hex;
  };
  UI.avatar = function (party, o) {
    o = o || {};
    var cls = o.className || 'av';
    var name = M.data.partyName(party);
    /* class, title, style — react-dom writes `style` through the CSSOM after
       every other attribute, so it is always last however the JSX orders it. */
    if (party.party_kind !== 'user') {
      return '<span class="' + cls + ' team"' + attr('title', name) + ' style="background: var(--c-team);">' +
        M.icon('people') + '</span>';
    }
    var colour = party.hue || M.data.hue(name);
    return '<span class="' + cls + '"' + attr('title', name) + ' style="background: ' + UI.rgb(colour) + ';">' +
      esc(party.initials || M.data.initials(name)) + '</span>';
  };
  UI.stack = function (parties, o) {
    o = o || {};
    parties = parties || [];
    var cls = ['stack', o.size && o.size !== 'md' ? o.size : ''].filter(Boolean).join(' ');
    var inner = parties.length
      ? parties.slice(0, 2).map(function (p) { return UI.avatar(p); }).join('')
      /* No roster at all — the neutral glyph rather than a gap. */
      : '<span class="av" style="background: var(--c-none);">' + M.icon('people') + '</span>';
    return '<span class="' + cls + '"' + attr('title', o.title) + '>' + inner + '</span>';

                         openAttrs:'data-act="set" data-key="v.menu" data-val="sort"',

     trigger. `M.pendingMenus` is emptied by the core on every render. */

  function queueMenu(o) {
    var id = o.menuId || ('menu' + (++menuSeq));
    M.pendingMenus.push({ id: id, align: o.align === 'end' ? 'end' : 'start', menuLabel: o.menuLabel, menuHtml: o.menuHtml });

      : (o.label == null || o.label === '' ? (o.title !== undefined ? o.title : o.menuLabel) : undefined);

        (o.trailingIcon === null ? '' : M.icon(o.trailingIcon || 'chev', null, { cls: 'chevron' })),

  M.renderTitlebar = function (s, page) {

  M.fns.refresh = function () {

    M.set('refreshing', 'yes');

  /* ========================================================== the sidebar
     shell/sidebar.tsx:184-246. Which row is `on` comes from page.nav:
     a StoreRef, or 'all' | 'alerts' | 'settings' | 'setup'. Every row
     navigates with data-act="go" to the ids below. */
  M.storePages = {
    'acct:personal': 'store-personal',
    'acct:work': 'store-work',
    'team:eng': 'store-eng',
    'team:household': 'store-household',
    'team:homelab': 'store-homelab',
  };
  function navRow(o) {

  M.renderSidebar = function (s, page, opts) {
    opts = opts || {};
    s = s || M.s;

      UI.sectionLabel('Vaults', { as: 'side' }) +

      (w.shares.length ? UI.sectionLabel('Shares', { as: 'side' }) + w.shares.map(storeRow).join('') : '') +

  /* ================================================= whole-window states
     All three replace the shell outright: `App` returns one of them INSTEAD of
     `<VaultShell>`, so there is no title bar and no sidebar under any of them
     (app-root.tsx:172-254). They are takeovers, never overlays.

     `.app-lock`, `.app-lock-card` and `.app-loading` are styled by app.css,
     which 00-head.html links, so none of them carries an inline style: the
     card, its heading, its paragraph and its stretched button are all the
     sheet's own rules. `.app-lock{flex:1}` works because `.window` is a flex
     column, exactly as `#root > .window` is in the app. */

  /* app-root.tsx:172-223. The mock bridge's mechanism is "password". */
  function appLockCard(s) {
    var mechanism = M.data.appLock.mechanism === 'biometry'
      ? 'Touch ID or your Mac password' : 'your operating-system password';
    return '<div class="app-lock" role="dialog" aria-modal="true" aria-labelledby="app-lock-title">' +
      '<div class="app-lock-card">' +
      '<h1 id="app-lock-title">Unlock FOKS</h1>' +
      '<p>Authenticate with ' + mechanism + ' to allow FOKS to connect to servers and read vault data.</p>' +
      (s.v.lockError ? '<p class="app-lock-error" role="alert">' + esc(s.v.lockError) + '</p>' : '') +
      UI.btn('Unlock', { variant: 'primary', attrs: 'data-act="call" data-fn="unlockApp"' }) +
      '</div></div>';
  }

  /* app-root.tsx:225-251 — note the curly apostrophe in "Couldn’t". */
  function bootErrorCard() {
    return '<div class="app-lock" role="alertdialog" aria-labelledby="app-boot-error-title">' +
      '<div class="app-lock-card">' +
      '<h1 id="app-boot-error-title">Couldn’t load FOKS</h1>' +
      '<p class="app-lock-error" role="alert">An injected world must include the bridge that answers its item actions.</p>' +
      UI.btn('Retry', { variant: 'primary', attrs: 'data-act="set" data-key="boot" data-val="ok"' }) +
      '</div></div>';
  }

  /* write-workflows.tsx:788-822 — a sibling of `.app` inside `.window`,
     absolutely positioned inset:44px 0 0 0, so the title bar above it stays
     visible and live. */
  M.stopwrap = function () {
    return '<div aria-label="Local agent connection lost" class="stopwrap" role="alertdialog" aria-modal="true" tabindex="-1">' +
      UI.notice({
        severity: 'crit',
        eyebrow: 'This Mac · the local agent',
        title: 'The local agent connection was lost',
        body: '<p>We encountered a connection error with the local FOKS agent. Your data has been saved, and in-progress operations can be continued once a connection is restored.</p>',
        actions: UI.btn('Retry', { variant: 'primary', attrs: 'data-act="call" data-fn="agentRetry"' }),
      }) + '</div>';
  };

  /**
   * The whole-window states that outrank whatever page is showing.
   *
   * Returns a render() result, or null when the page should draw itself.
   * Every page renderer must start with:
   *     var t = M.globalTakeover(s); if (t) return t;
   *
   *   lock=locked   the Unlock FOKS card instead of the shell. `App` reads
   *                 the lock BEFORE loadWorld and returns it in place of
   *                 <VaultShell>, so it outranks both boot screens and there
   *                 is no title bar under it — it is not an overlay.
   *   boot=error    the boot-error card instead of the shell
   *   boot=loading  the app-loading placeholder instead of the shell
   *
   * `agent=lost` is deliberately NOT here. The app keeps rendering the whole
   * screen and hangs `.stopwrap` off `.window` as a SIBLING of `.app`
   * (write-workflows.tsx:788 draws it as a Dialog; the capture in
   * /tmp/foks-mock/cap/world/agent-lost.html shows the full items list under
   * it), so returning a takeover would have thrown the page away. The core
   * appends `M.windowTail(s)` after `.app` instead, which means every page
   * gets the app's exact tree without touching its renderer.
   *
   */
  M.globalTakeover = function (s) {
    s = s || M.s;
    /* app-root.tsx:172 — the lock is read before loadWorld, so it wins. */
    if (s.lock === 'locked') return { takeover: appLockCard(s) };
    if (s.boot === 'error') return { takeover: bootErrorCard() };
    if (s.boot === 'loading') {
      return { takeover: '<div class="app-loading">Connecting to the local agent…</div>' };
    }
    return null;
  };
  /* Appended by the core after `.app`, inside `.window`; a page may override
     it with `windowTail` in its own render result. */
  M.windowTail = function (s) {
    s = s || M.s;
    return s.agent === 'lost' ? M.stopwrap() : '';
  };

  /* The core appends this to #overlays after the page's own overlay(s).
     Nothing global lives there any more — the app lock moved into
     globalTakeover, where the app puts it — but the hook stays so a future
     frame-wide overlay has somewhere to go. */
  M.renderGlobalOverlay = function () { return ''; };

  /* Retry: bridge.retryAgentConnection(), then `refresh('Connected to the
     local agent')` — which is refreshWorld() and then the toast, so the
     titlebar's refresh flag flickers exactly as the global Refresh does. The
     interrupted write is never replayed. */
  M.fns.agentRetry = function () {
    M.patch({ agent: 'ready', refreshing: 'yes' });
    M.render();
    setTimeout(function () {
      M.set('refreshing', 'no');
      M.toast('Connected to the local agent');
    }, 260);
  };
  /* Unlocking drops the bridge and reboots the world load. */
  M.fns.unlockApp = function () {
    M.set('v.lockError', null, { silent: true });
    M.set('lock', 'off');
  };

  /* ======================================================== Escape
     app-root.tsx:482-497 plus the dialogs that handle it first: a sheet, a
     menu or a confirmation closes; otherwise the search clears; otherwise the
     selection drops. A page with a different rule may replace M.fns.escape in
     its own after(). */
  M.fns.escape = function () {
    var v = M.s.v;
    if (v.sheet) return M.set('v.sheet', null);
    if (v.menu) return M.set('v.menu', null);
    if (v.confirm) return M.set('v.confirm', null);
    if (v.search) return M.set('v.search', null);
    if (v.sel) return M.set('v.sel', null);
  };

  /* --------------------------------------------------------- placeholder
     So the assembled file boots before 40-items.js exists. M.page replaces by
     id, so the vault builder's own `all` overwrites this one. */
  M.page({
    id: 'all',
    title: 'All items',
    path: ['Vault', 'All items'],
    nav: 'all',
    note: 'placeholder from 30-shell.js — 40-items.js re-registers this id.',
    render: function (s) {
      var t = M.globalTakeover(s);
      if (t) return t;
      return { main: '<main class="main"></main>' };
    },
  });

  /* ======================================================== 40-items.js */
  /* ----------------------------------------------------------- 40-items.js
     The vault surface: All items and the five store pages.

       pages       all · store-personal · store-work · store-eng ·
                   store-household · store-homelab
       screens     screens/items-screen.tsx (header, toolbar, list, cards,
                   empties, All-items bands), screens/scope.ts (what is
                   listed, in what order), screens/store-access.tsx (the
                   takeover), screens/details-panel.tsx (the aside),
                   screens/write-workflows.tsx (New / exists / conflict /
                   discard / remove), screens/edit-value.ts.

     View keys, all read as s.v.<key> (null = the first value):

       view     list | grid                 state.view
       kind     All | Password | Resource | File | Link
       sort     name | kind | group | version
       search   the query (paths and store names only, never contents)
       sel      "<storeRef>|<path>" — M.data.itemKey
       details  shown | hidden              null follows the selection
       reveal   1                           the one-shot exact-version read
       sheet    new-password | new-resource | new-file | new-link | edit |
                replace | remove | exists | conflict | discard
       menu     new | new-empty | sort | save-in
       dest     the StoreRef the New sheet saves in
       readRole / writeRole  Owner | Admin | Member   (+ readVis / writeVis)
       advanced 1     the New sheet's Advanced disclosure
       inspect  1     the details panel's "Inspect response" disclosure
       site/user/pw/web/rname/val/target/dpath/draft   free-text draft fields
       ekind / epath   which create the `exists` refusal is about
       applied  the write ops, replayed onto the fixture on every render
       adhoc    yes    60-groups' key: Homelab's creation was resumed

     Every write goes through `applied`, so a create, an edit and a remove are
     each a URL: the fixture is restored and the ops replayed at the head of
     every render, and clicking Create / Save version n+1 / Remove in the
     frame pushes the same op onto the list. */

  (function () {
    var D = M.data;
    var UI = M.ui;
    var esc = M.esc;
    var h = M.h;

    var ITEM_PAGES = {
      all: null,
      'store-personal': 'acct:personal',
      'store-work': 'acct:work',
      'store-eng': 'team:eng',
      'store-household': 'team:household',
      'store-homelab': 'team:homelab',
    };
    var GROUP_PAGES = {
      'team:eng': 'eng-people',
      'team:household': 'household-people',
      'team:homelab': 'homelab-people',
    };
    /* write-workflows.tsx:81-86 */
    var DRAFT_PATH = {
      Password: '/logins/github.com',
      Resource: '/agents/anthropic-api-key',
      File: '/documents/emergency.pdf',
      Link: '/latest-key',
    };
    var SHEET_KIND = {
      'new-password': 'Password',
      'new-resource': 'Resource',
      'new-file': 'File',
      'new-link': 'Link',
    };
    /* shell/toolbar.tsx:23-28 */
    var SORT_LABELS = { name: 'Sort by name', kind: 'Sort by kind', group: 'Grouped', version: 'Sort by version' };
    var SORT_KEYS = ['name', 'kind', 'group', 'version'];
    /* details-panel.tsx:58-63 */
    var FIELD_LABELS = { user: 'User name', password: 'Password', url: 'Website', ssid: 'Network' };

    /* --------------------------------------------- applied (the mutations)
       The same contract 60-groups uses: `v.applied` is a comma-separated list
       of write ops, the fixture is put back at the head of every render and
       the list is replayed on top. So a create, a save and a remove are all
       in the URL and a flow step can land on the result cold, while a click
       in the frame is just one more op pushed onto the list.

         new~<Kind>~<store>~<path>~<read>~<write>   a create
         save~<store>~<path>~<version>              an edit / a replace
         rm~<store>~<path>                          a remove

       Roles are wire words: `Owner`, `Admin`, `Member.0`; stores are the
       short aliases below, so a token carries no `:` and 60-groups' own
       `applied` parser (which splits on `:`) cannot mistake it for a roster
       op. What was typed into the sheet or the editor stays out of the URL —
       the token carries the row, TYPED carries the value Show would return. */
    var SHORT = { 'acct:personal': 'personal', 'acct:work': 'work', 'team:eng': 'eng', 'team:household': 'household', 'team:homelab': 'homelab' };
    var LONG = { personal: 'acct:personal', work: 'acct:work', eng: 'team:eng', household: 'team:household', homelab: 'team:homelab' };
    var BASE_ITEMS = D.items.map(function (row) { return Object.assign({}, row); });
    var BASE_PLAINTEXT = Object.assign({}, D.plaintext);
    var TYPED = {};
    /* Readable aliases so `?applied=created-password` is a state a flow can
       point at. Each expands to one op above. */
    var NAMED = {
      'created-password': 'new~Password~personal~/logins/gitlab.com~Owner~Owner',
      'created-note': 'new~Resource~personal~/agents/deploy-token~Owner~Owner',
      'created-file': 'new~File~household~/documents/insurance.pdf~Member.0~Admin',
      'created-link': 'new~Link~personal~/current-key~Owner~Owner',
      'saved-github': 'save~personal~/logins/github.com~10',
      'removed-github': 'rm~personal~/logins/github.com',
    };
    /* The value a named create would have carried, so Show still answers. */
    var NAMED_VALUE = {
      'acct:personal|/logins/gitlab.com': 'user: rae\npassword: swift-Anchor-42-loom\nurl: https://gitlab.com/login',
      'acct:personal|/agents/deploy-token': 'dpl-9f2c1a7b64e0a3d5',
      'acct:personal|/current-key': '/agents/anthropic-api-key',
    };
    function parseWire(word) {
      if (!word || word === 'Owner') return { role: 'Owner' };
      if (word === 'Admin') return { role: 'Admin' };
      var bits = word.split('.');
      return { role: 'Member', visibility: Number(bits[1]) || 0 };
    }
    function wireWord(wire) {
      var role = wire && wire.role;
      return role === 'Member' ? 'Member.' + (wire.visibility || 0) : (role || 'Owner');
    }
    function ops(s) {
      return String((s.v && s.v.applied) || '').split(',').filter(Boolean)
        .map(function (token) { return NAMED[token] || token; });
    }
    function pushOp(token) {
      var list = String(M.s.v.applied || '').split(',').filter(Boolean);
      if (list.indexOf(token) < 0) list.push(token);
      M.s.v.applied = list.join(',');
    }
    /* A write never moves `item.value`, only the plaintext behind it.
       `list_catalog` carries no value at all (mock-bridge.ts:337-345 builds the
       CatalogDto from store/path/kind/size/version/read/write), and the
       non-native merge in bridge.ts `loadWorld` re-attaches the value from the
       PRISTINE fixture (`base = bridge.fixtureWorld`), not from the mutated
       bridge state. So after an edit the details panel still previews the
       original masked login skeleton at the new version and size, and a freshly
       created item has no `value` at all — one masked `Password` row, not the
       fields that were typed into the sheet. `D.plaintext` is the bridge's
       `contents` map: that is what Show returns, and that does move. */
    function applyItemOp(token) {
      var bits = token.split('~');
      var op = bits[0];
      if (op === 'new') {
        var kind = bits[1], store = LONG[bits[2]] || bits[2], path = bits[3];
        if (D.itemAt(store, path)) return;
        var key = store + '|' + path;
        var value = TYPED[key] != null ? TYPED[key] : NAMED_VALUE[key];
        var row = {
          store: store, path: path, kind: 'Secret', size: 0, version: 1,
          read: parseWire(bits[4]), write: parseWire(bits[5]),
        };
        if (kind === 'File') { row.kind = 'File'; row.size = (value || '').length; }
        else if (kind === 'Link') { row.kind = 'Link'; row.target = value || ''; row.size = row.target.length; }
        else { row.size = (value || '').length; D.plaintext[key] = value || ''; }
        D.items.push(row);
        return;
      }
      var ref = LONG[bits[1]] || bits[1];
      var hit = D.itemAt(ref, bits[2]);
      if (op === 'rm') {
        D.items = D.items.filter(function (r) { return !(r.store === ref && r.path === bits[2]); });
        delete D.plaintext[ref + '|' + bits[2]];
        return;
      }
      if (op === 'save' && hit) {
        hit.version = Number(bits[3]) || hit.version + 1;
        var skey = ref + '|' + bits[2];
        var typed = TYPED[skey];
        /* A cold `applied=saved-github` has nothing in TYPED — nobody typed
           anything into this session's editor — but the app still WROTE
           something: the editor opens on `editableValue(item, plaintext)` and
           Save sends exactly that back, so an untouched save replaces the
           stored value with the merged skeleton and the size follows it (142 B
           → 73 B on github.com). Derive it rather than leaving the old size,
           which is the size of a write that never happened. A File replace
           streams a new file and the fixture's size is all the mock knows, so
           that one stays put — which is also what the app shows. */
        if (typed == null && hit.kind !== 'File' && D.kindOf(hit) !== 'Link') {
          typed = editableValue(hit, D.plaintext[skey] || '');
        }
        if (typed != null && hit.kind !== 'File') {
          hit.size = typed.length;
          D.plaintext[skey] = typed;
        }
      }
    }
    function syncItems(s) {
      D.items = BASE_ITEMS.map(function (row) { return Object.assign({}, row); });
      D.plaintext = Object.assign({}, BASE_PLAINTEXT);
      ops(s).forEach(applyItemOp);
    }

    /* ------------------------------------------------------ view readers */
    function vv(s, key, dflt) {
      var v = s.v[key];
      return v == null || v === '' ? dflt : v;
    }
    function viewOf(s) { return vv(s, 'view', 'list'); }
    function kindFilter(s) { return vv(s, 'kind', 'All'); }
    function sortOf(s) { return vv(s, 'sort', 'name'); }
    function queryOf(s) { return s.v.search || ''; }

    /* ------------------------------------------ model helpers not in 20-data
       model/lease.ts:164-224, ported against the world M.data.world returns
       (its stores already carry `readable` and `parties`). */
    function ownParty(store) {
      return store.parties.filter(function (p) {
        return p.label === 'you' && p.party_kind === 'user' && p.locally_manageable &&
          D.admissionActive(p, store.id);
      });
    }
    function canCreateInStore(w, ref) {
      var store = w.storeById[ref];
      if (!store || !store.readable) return false;
      if (store.kind === 'account') return true;
      return ownParty(store).length === 1;
    }
    function canChangeItem(w, item) {
      var store = w.storeById[item.store];
      if (!store || !canCreateInStore(w, store.id)) return false;
      if (store.kind === 'account') return true;
      var own = ownParty(store);
      return own.length === 1 && D.admits(own[0].destination_role, item.write);
    }
    function defaultCreateStore(w) {
      var order = w.navOrder;
      for (var i = 0; i < order.length; i++) if (canCreateInStore(w, order[i].id)) return order[i].id;
      return order[0] ? order[0].id : '';
    }
    /* items-screen.tsx: `createStore` is the store being looked at when it can
       be written to, and `defaultCreateStore(world)` otherwise — so a New sheet
       opened on Engineering saves into Engineering, and one opened on All items
       (or on a store nothing can be written to) falls back to the first store in
       navigation order that takes a write. `v.dest` is the choice already made
       in the Save-in chooser; this is what it starts from. */
    function createStoreFor(s, w) {
      var page = M.pages[s.page];
      var ref = page && page.ref;
      return ref && canCreateInStore(w, ref) ? ref : defaultCreateStore(w);
    }
    /* write-workflows.tsx:183-196 */
    function writeBlockReason(w, store) {
      if (canCreateInStore(w, store.id)) return null;
      var srv = w.serverById[store.server];
      if (srv && srv.state === 'lease-lapsed') return 'server check-in lapsed — nothing can be written here';
      if (srv && srv.state === 'blocked') return 'server access is blocked — nothing can be written here';
      if (srv && srv.state === 'lease-unavailable') return 'check-in status unknown — nothing can be written here';
      if (store.kind === 'team' && !store.active) return 'reports inactive — resume its creation first';
      if (store.kind === 'team') return 'no authenticated local group identity — writing is unavailable';
      return 'nothing can be written here';
    }
    /* screens/edit-value.ts */

    var baseEscape = M.fns.escape;
    function itemsEscape() {
      if (!(M.s.page in ITEM_PAGES)) return baseEscape();
      var v = M.s.v;

         calls preventDefault, so app-root's window rule runs on the SAME
         press: Escape over the conflict both turns the question over and
         clears the query, or drops the selection behind it. The app really
         does leave an empty details panel behind the sheet (steps

         which does stop the event. */
      if (v.sheet === 'conflict' || v.sheet === 'discard') {

      if (v.menu) return M.set('v.menu', null);

         app-root's window rule: the query first, the selection second. The
         editor dies with the selection (details-panel drops it on change),
         which is why Escape over an open editor leaves an empty panel rather
         than the item back in view mode. */
      if (v.sheet && v.sheet !== 'edit' && v.sheet !== 'replace') {

      if (v.search) return M.set('v.search', null);
      if (v.sel) {

    window.addEventListener('blur', function () {
      if (!(M.s.page in ITEM_PAGES)) return;

    document.addEventListener('keydown', function (ev) {

    document.addEventListener('keydown', function (ev) {

  /* ======================================================== 60-groups.js */
  /* --------------------------------------------------------- 60-groups.js
     Group settings (People / Settings), the party panel, the federation
     table, the six-in-one GroupSheet, and Settings › Groups.

     Transcribed from foks-ui/src/screens/groups-screen.tsx (whole file),
     screens/store-access.tsx, the GroupsSection + invite dialog of
     screens/settings-screen.tsx, and model/roles.ts + model/readers.ts.
     Ground truth for structure and classes: /tmp/foks-mock/cap/groups/*.html.

     Pages
       eng-people        Groups › Engineering › People
       eng-settings      Groups › Engineering › Settings
       household-people  Groups › Household › People
       household-settings
       homelab-people    Groups › Homelab › People       (inactive ad-hoc)
       homelab-settings
       platform-people   Groups › Platform › People      (what F1 creates; the
       platform-settings                                  §1.14 fallback until
                                                          `created` is set)
       group-unavailable Groups › Group unavailable      (the §1.14 fallback)
       set-groups        Settings › Groups               (settings layout)
       store-platform    Vault › Platform                (created by F1; see
                                                          the note on it below)

     View keys (all declared per page): tab · panel · sheet · target · menu ·
     role · visibility · remote · gkind · name · username · account · created ·
     applied · adhoc · failure · inspect.

     `applied` is the post-mutation world, held as URL-reproducible tokens
     (`op:store:arg…`, several joined by `,`) rather than as a one-way
     mutation: every render rebuilds M.data.parties / M.data.federation from
     the pristine fixture and replays the tokens, so the sidebar caption, the
     reader counts and the Alerts badge all move with the roster exactly as
     they do in the app, and a capture URL reproduces the state.  */

  (function () {

    var esc = M.esc;
    var h = M.h;

       The pristine copy of everything a mutation touches. syncWorld() puts
       M.data back to this and replays `v.applied` / `v.created` on top, so
       nothing here ever drifts and every state is reachable from its URL
       alone; restoreFixture() (from after()) puts it back again the moment
       this render is on screen, so the residue never reaches a page owned by
       another part — the sidebar, Alerts and the vault pages all re-derive
       from M.data and none of them resets the roster. */
    var TEAMS = ['team:eng', 'team:household', 'team:homelab'];
    var BASE = {
      parties: {},
      federation: D.federation.slice(),
      stores: D.stores.slice(),
      partyList: D.partyList.slice(),
      /* `active` is read off the shared store object, which 40-items writes in
         place from its own sync — so the fixture's value is kept, not the
         object's. */
      homelabActive: (D.stores.filter(function (st) { return st.id === 'team:homelab'; })[0] || {}).active,
    };
    TEAMS.forEach(function (ref) { BASE.parties[ref] = D.partiesOf(ref).slice(); });

    var SHORT = { 'team:eng': 'eng', 'team:household': 'household', 'team:homelab': 'homelab', 'team:platform': 'platform' };
    var LONG = { eng: 'team:eng', household: 'team:household', homelab: 'team:homelab', platform: 'team:platform' };

    /* The group F1 creates, exactly as mock-bridge.ts:556 `createGroup`
       answers it: `team:<teamAlias>`, `name || teamAlias` (so an AD-HOC group
       — which sends no name — is known by its alias, lower-case), the
       account's server and account, and a `03` / `14` prefixed id. The whole
       identity rides in `v.created` as `alias|name|kind|accountStore`, so
       `?page=store-platform&created=…` reproduces either branch of F1. */
    function createdOf(token) {
      var bits = String(token).split('|');
      var alias = bits[0] || 'platform';
      var kind = bits[2] === 'adhoc' ? 'adhoc' : 'named';
      return {
        alias: alias, kind: kind,
        name: kind === 'named' ? (bits[1] || 'Platform') : alias,
        account: bits[3] || 'acct:work',

    }
    function createdToken(o) {
      return [o.alias, o.kind === 'named' ? o.name : '', o.kind, o.account].join('|');
    }
    function createdStore(o) {
      var account = BASE.stores.filter(function (st) { return st.id === o.account; })[0] ||
        BASE.stores.filter(function (st) { return st.kind === 'account'; })[0];
      return {
        id: 'team:' + o.alias, kind: 'team', name: o.name, alias: o.alias,
        server: account.server, account: account.account, active: true,
        team_kind: o.kind,
        team_id_hex: (o.kind === 'named' ? '03' : '14') + new Array(65).join('1'),

    }
    function createdParty(store) {

        store: store.id, username: username, label: 'you', party_kind: 'user',
        generation: 1, locally_manageable: true,
        party_id_hex: '01' + new Array(65).join('2'),
        source_role: { role: 'Owner' }, destination_role: { role: 'Owner' },

    /* ------------------------------------------------------------ state */
    function v(s, key, dflt) {
      var val = s.v[key];
      return (val === undefined || val === null || val === '') ? dflt : val;
    }
    /* A text field the user can legitimately empty: the core's bound inputs
       keep '' as '' (README, "Bound inputs"), so typing the field empty is
       read back as ''. Only a DECK CHIP cannot write '' — putKey folds it to
       null, i.e. back to the default — so the "(cleared)" chips carry EMPTY
       and this reads that token as the empty string too. */
    var EMPTY = '(empty)';
    function vtext(s, key, dflt) {

    }
    function ops(s) {

    }

       (name/initials/hue) are carried like every other fixture party. */
    function userParty(ref, username, role, visibility, idHex, generation) {
      var dest = role === 'Member' ? { role: 'Member', visibility: visibility } : { role: role };
      return {
        store: ref, username: username, party_kind: 'user',
        generation: generation == null ? 1 : generation, locally_manageable: true,
        party_id_hex: idHex, source_role: dest, destination_role: dest,
        name: username, initials: D.initials(username), hue: D.hue(username),
      };
    }

    var OPS = { add: 1, demote: 1, remove: 1, admit: 1, restore: 1 };
    function applyOp(token) {
      var bits = token.split(':');
      var op = bits[0];
      var ref = LONG[bits[1]] || bits[1];
      /* `applied` is a key 70-settings and 71-servers also write (as 'yes' /
         '1'), and a flow can carry theirs onto one of our pages — anything
         that is not one of our tokens is simply not a group mutation. */
      if (!OPS[op] || !D.parties[ref]) return;
      var list = D.parties[ref];
      if (op === 'add') {
        list.push(userParty(ref, bits[2], bits[3], +bits[4] || 0,
          '01' + '3333333333333333333333333333333333333333333333333333333333333339'.slice(0, 64)));
      } else if (op === 'demote') {
        list.forEach(function (p, i) {
          if (p.username !== bits[2]) return;
          var next = Object.assign({}, p, { generation: p.generation + 1 });
          next.destination_role = bits[3] === 'Member'
            ? { role: 'Member', visibility: +bits[4] || 0 } : { role: bits[3] };
          list[i] = next;
        });
      } else if (op === 'remove') {
        D.parties[ref] = list.filter(function (p) { return p.username !== bits[2]; });
      } else if (op === 'admit') {
        var remote = D.stores.filter(function (st) { return st.alias === bits[2] && st.kind === 'team'; })[0];
        if (!remote) return;
        var host = D.servers.filter(function (srv) { return srv.id === remote.server; })[0];
        var vis = +bits[3] || 0;
        var count = D.federation.filter(function (f) { return f.store === ref; }).length + 1;
        D.parties[ref] = list.concat([{
          store: ref, username: null, party_kind: 'named-team',
          team_name: remote.alias + ' @ ' + (host ? host.name : remote.server),
          generation: 1, locally_manageable: false,
          party_id_hex: remote.team_id_hex,
          scoped_host_id_hex: host ? host.host_id : null,
          source_role: { role: 'Owner' },
          destination_role: { role: 'Member', visibility: vis },
          name: remote.alias + ' @ ' + (host ? host.name : remote.server),
          initials: '', hue: 'var(--c-team)',
        }]);
        D.federation = D.federation.concat([{
          store: ref, remote_profile: remote.server, remote_team_alias: remote.alias,
          remote_host_id_hex: host ? host.host_id : null, remote_team_id_hex: remote.team_id_hex,
          destination: { role: 'Member', visibility: vis },
          operation_id_hex: 'admission-' + count, active: true,
        }]);
      } else if (op === 'restore') {
        D.federation = D.federation.map(function (entry) {
          return (entry.store === ref && entry.operation_id_hex === bits[2])
            ? Object.assign({}, entry, { active: true }) : entry;
        });
      }
    }

    var FAILURES = {
      roster: { source: 'roster', code: 'rate-limited', message: 'Roster request was limited.', retryable: true },
      federation: { source: 'federation', code: 'quota-exceeded', message: 'Federation capacity was reached.', retryable: false },
    };

    /* Put the fixture back, then replay this state's knobs on top. Called at
       the head of every renderer here, before M.data.world(s) is read.
       Nothing in BASE is ever mutated — `adhoc` swaps in a *copy* of the
       Homelab store, so unsetting the knob puts the inactive one back. */
    function syncWorld(s, ref) {
      restoreFixture();
      var resumed = v(s, 'adhoc', 'no') === 'yes';
      /* Always a copy, never the fixture object: 40-items writes
         `homelab.active` in place from its own sync, so reading BASE's object
         back would carry that write into a state that has the knob off. */
      D.stores = BASE.stores.map(function (st) {
        return st.id === 'team:homelab' ? Object.assign({}, st, { active: resumed }) : st;
      });

      if (v(s, 'created', '')) ensureCreated(createdOf(v(s, 'created', '')));

      var failure = v(s, 'failure', '');
      if (ref && failure) {
        if (failure === 'roster' || failure === 'both')
          D.groupDetailFailures.push(Object.assign({ store: ref }, FAILURES.roster));
        if (failure === 'federation' || failure === 'both')
          D.groupDetailFailures.push(Object.assign({ store: ref }, FAILURES.federation));
      }

       it. Called from after(), once this render is on screen: every page here
       re-derives its whole world from `v.applied` / `v.created` / `v.adhoc` /
       `v.failure` at the head of its own render, so the fixture is only ever
       ours for the length of one render — and a page owned by another part
       (the sidebar's caption, Alerts, any vault) can never inherit a roster
       we changed or a group we created. */

      });

         creation in one session replaces the first). */
