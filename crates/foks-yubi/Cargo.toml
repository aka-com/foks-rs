[package]
name = "foks-yubi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated macOS/Linux YubiKey PIV provider for FOKS v0.1.9"
publish = false

[features]
default = []
hardware = ["dep:yubikey"]

[dependencies]
foks-crypto = { workspace = true }
foks-proto = { workspace = true }
foks-snowpack = { workspace = true }
getrandom = { workspace = true }
ml-kem = { workspace = true }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
zeroize = { workspace = true }
yubikey = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
