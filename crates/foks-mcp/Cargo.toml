[package]
name = "foks-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version = "1.88"

[dependencies]
base64.workspace = true
foks-crypto.workspace = true
getrandom.workspace = true
foks-agent-client.workspace = true
foks-agent-proto.workspace = true
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
zeroize.workspace = true

[dev-dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["client"] }

[lints]
workspace = true
