[package]
name = "foks-server-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sealed isolated-process test composition for foks-server"

[dependencies]
foks-oidc = { workspace = true, features = ["test-support"] }
base64 = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true }
url = "2"
foks-client = { workspace = true }
foks-proto = { workspace = true }
foks-server = { workspace = true }
foks-server-db = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tempfile = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
foks-desktop = { path = "../foks-desktop", default-features = false }
foks-agent-client = { workspace = true }
foks-agent-proto = { workspace = true }
foks-client = { workspace = true, features = ["test-support"] }
foks-client-app = { workspace = true }
foks-client-db = { workspace = true }
foks-compat-artifact = { workspace = true }
foks-crypto = { workspace = true }
foks-merkle-store = { workspace = true }
foks-rpc = { workspace = true }
foks-snowpack = { workspace = true }
foks-verify = { workspace = true }
foks-yubi = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
