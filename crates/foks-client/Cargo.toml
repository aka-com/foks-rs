[package]
name = "foks-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native FOKS v0.1.9 identity, recovery, team, and KV client"
autotests = false

[features]
test-support = []

[dependencies]
chacha20poly1305 = { workspace = true }
foks-client-db = { workspace = true }
foks-crypto = { workspace = true }
foks-oidc = { workspace = true }
foks-merkle-store = { workspace = true }
foks-proto = { workspace = true }
foks-rpc = { workspace = true }
foks-snowpack = { workspace = true }
foks-verify = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
thiserror = { workspace = true }
webpki-roots = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
foks-yubi = { workspace = true }
foks-oidc = { workspace = true, features = ["test-support"] }
rcgen = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "public_probe"
path = "tests/public_probe.rs"

[[test]]
name = "sso_live"
path = "tests/sso_live.rs"

[[test]]
name = "account_live"
path = "tests/account_live.rs"
