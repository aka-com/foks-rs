[package]
name = "foks-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone single-host FOKS v0.1.9 server"

[dependencies]
base64 = { workspace = true }
foks-oidc = { workspace = true }
serde_json = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
url = "2"
chacha20poly1305 = { workspace = true }
clap = { workspace = true }
foks-crypto = { workspace = true }
foks-merkle-store = { workspace = true }
foks-proto = { workspace = true }
foks-rpc = { workspace = true }
foks-server-db = { workspace = true }
foks-snowpack = { workspace = true }
foks-verify = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
lru = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
signal-hook = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
foks-oidc = { workspace = true, features = ["test-support"] }
foks-client-db = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
