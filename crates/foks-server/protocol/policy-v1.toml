protocol = "Probe"
method = "probe"
position_constant = "PROBE_METHOD_POSITION"
listener = "probe"
authentication = "public"
request = "ProbeArgument"
result = "ProbeResponse"
statuses = ["ok", "bad_args", "unsupported"]
max_request_bytes = 4096
supported = true
coverage = ["probe_and_pin"]


