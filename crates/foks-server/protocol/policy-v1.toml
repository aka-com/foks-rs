tx_retry = "TX_RETRY_ERROR"
team_error = "TEAM_ERROR"
team_race = "TEAM_RACE_ERROR"
team_bearer_token_stale = "TEAM_BEARER_TOKEN_STALE_ERROR"
team_not_found = "TEAM_NOT_FOUND_ERROR"
team_cert = "TEAM_CERT_ERROR"
team_roster = "TEAM_ROSTER_ERROR"
team_key = "TEAM_KEY_ERROR"
team_no_source_role = "TEAM_NO_SRC_ROLE_ERROR"
