# Handwritten local policy. Numeric wire identities come only from upstream metadata.
version = 1
baseline = "foks-v0.1.9"

[status_aliases]
ok = "OK"
bad_args = "BAD_ARGS_ERROR"
device_already_provisioned = "DEVICE_ALREADY_PROVISIONED_ERROR"
expired = "EXPIRED_ERROR"
locked = "KV_LOCK_ALREADY_HELD_ERROR"
kv_noent = "KV_NOENT_ERROR"
kv_permission = "KV_PERM_ERROR"
name_in_use = "USERNAME_IN_USE_ERROR"
not_found = "GENERIC_NOT_FOUND_ERROR"
permission_denied = "PERMISSION_ERROR"
quota_exceeded = "OVER_QUOTA_ERROR"
rate_limited = "RATE_LIMIT_ERROR"
stale_cache = "KV_STALE_CACHE_ERROR"
stale_root = "TX_RETRY_ERROR"
tx_retry = "TX_RETRY_ERROR"
team_error = "TEAM_ERROR"
team_race = "TEAM_RACE_ERROR"
team_bearer_token_stale = "TEAM_BEARER_TOKEN_STALE_ERROR"
team_not_found = "TEAM_NOT_FOUND_ERROR"
team_cert = "TEAM_CERT_ERROR"
team_roster = "TEAM_ROSTER_ERROR"
team_key = "TEAM_KEY_ERROR"
team_no_source_role = "TEAM_NO_SRC_ROLE_ERROR"
team_removal_key = "TEAM_REMOVAL_KEY_ERROR"
team_explore = "TEAM_EXPLORE_ERROR"
team_adhoc_creator_included = "TEAM_ADHOC_CREATOR_INCLUDED_ERROR"
team_adhoc_open_viewership = "TEAM_ADHOC_OPEN_VIEWERSHIP_ERROR"
team_adhoc_invalid_change = "TEAM_ADHOC_INVALID_TEAM_CHANGE_ERROR"
team_adhoc_duplicate = "TEAM_ADHOC_DUPLICATE_ERROR"
unsupported = "NOT_IMPLEMENTED"

[[protocol]]
name = "Probe"
upstream = "Probe"
id_constant = "PROBE_PROTOCOL_ID"

[[protocol]]
name = "Reg"
upstream = "Reg"
id_constant = "REG_PROTOCOL_ID"

[[protocol]]
name = "User"
upstream = "User"
id_constant = "USER_PROTOCOL_ID"

[[protocol]]
name = "TeamLoader"
