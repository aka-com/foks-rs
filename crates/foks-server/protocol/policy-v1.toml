[[protocol]]
name = "KvStore"
upstream = "KVStore"
id_constant = "KV_STORE_PROTOCOL_ID"

[[service]]
name = "registration"
upstream = "Reg"
listener = "public_services"
supported = true

[[service]]
name = "user"
upstream = "User"
listener = "authenticated"
supported = true

[[service]]
name = "merkle_query"
upstream = "MerkleQuery"
listener = "public_services"
supported = true

[[service]]
name = "probe"
