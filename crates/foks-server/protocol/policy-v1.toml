# Handwritten local policy. Numeric wire identities come only from upstream metadata.
version = 1
baseline = "foks-v0.1.9"

[status_aliases]
rt_generic = "RT_GENERIC_ERROR"
rt_channel_exists = "RT_CHANNEL_EXISTS_ERROR"
rt_race = "RT_RACE"
rt_ambiguous_channel = "RT_AMBIGUOUS_CHANNEL_ERROR"
rt_not_found = "RT_NOT_FOUND_ERROR"
rt_msg_order = "RT_MSG_ORDER_ERROR"
ok = "OK"
bad_args = "BAD_ARGS_ERROR"
bad_invite = "BAD_INVITE_CODE_ERROR"
bad_passphrase = "BAD_PASSPHRASE_ERROR"
device_already_provisioned = "DEVICE_ALREADY_PROVISIONED_ERROR"
duplicate = "DUPLICATE_ERROR"
expired = "EXPIRED_ERROR"
locked = "KV_LOCK_ALREADY_HELD_ERROR"
lock_timeout = "KV_LOCK_TIMEOUT_ERROR"
kv_noent = "KV_NOENT_ERROR"
kv_permission = "KV_PERM_ERROR"
kv_race = "KV_RACE_ERROR"
key_not_found = "KEY_NOT_FOUND_ERROR"
kex_bad_secret = "KEX_BAD_SECRET"
merkle_leaf_not_found = "MERKLE_LEAF_NOT_FOUND_ERROR"
merkle_no_root = "MERKLE_NO_ROOT_ERROR"
merkle_verify = "MERKLE_VERIFY_ERROR"
name_in_use = "USERNAME_IN_USE_ERROR"
not_found = "GENERIC_NOT_FOUND_ERROR"
permission_denied = "PERMISSION_ERROR"
passphrase_not_found = "PASSPHRASE_NOT_FOUND_ERROR"
quota_exceeded = "OVER_QUOTA_ERROR"
rate_limited = "RATE_LIMIT_ERROR"
revoke_race = "REVOKE_RACE_ERROR"
stale_cache = "KV_STALE_CACHE_ERROR"
