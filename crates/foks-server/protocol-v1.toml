version = 1
baseline = "foks-v0.1.9"

# Exact numeric values from proto/lib/status.go in go-foks v0.1.9. Route
# entries use the narrower semantic names below; aliases intentionally share
# the upstream code when the v1 policy maps them to the same wire status.
[status_codes]
ok = 0
bad_args = 1030
locked = 8014
name_in_use = 1023
not_found = 1049
permission_denied = 1013
quota_exceeded = 1060
rate_limited = 1012
stale_cache = 8012
stale_root = 1014
tx_retry = 1014
unsupported = 1020

[[service]]
name = "registration"
service_type = 1
listener = "public_services"
supported = true

[[service]]
name = "user"
service_type = 2
listener = "authenticated"
supported = true

