serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
foks-server-db = { workspace = true }
foks-merkle-store = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
