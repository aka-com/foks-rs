[package]
name = "foks-metadata-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded native/Wasm metadata transaction feasibility kernel"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
native = ["dep:rusqlite", "dep:getrandom"]
read-token-qualification = []

[dependencies]
foks-schema-contract = { workspace = true }
foks-proto = { workspace = true }
foks-snowpack = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = "0.12"
# Existing locked HMAC uses digest 0.10; keep existing metadata SHA-256 unchanged.
sha2_hmac = { package = "sha2", version = "0.10" }
zeroize = { workspace = true }
getrandom = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
foks-rpc = { workspace = true }
foks-server-db = { workspace = true }
foks-merkle-store = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
