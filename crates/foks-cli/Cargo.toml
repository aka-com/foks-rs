[package]
name = "foks-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "foks-rs"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
foks-client-app = { workspace = true }
foks-agent-client = { workspace = true }
foks-agent-proto = { workspace = true }
foks-mcp = { workspace = true }
tokio = { workspace = true }
foks-compat-artifact = { workspace = true }
foks-keystore = { workspace = true }
foks-yubi = { workspace = true, features = ["hardware"] }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
foks-oidc = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
foks-server-testkit = { workspace = true }

[lints]
workspace = true
