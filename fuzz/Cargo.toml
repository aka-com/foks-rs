[package]
name = "foks-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
# Exact: updated together with the cargo-fuzz version in
# .github/workflows/foks-fuzz.yml.
libfuzzer-sys = "=0.4.10"
foks-snowpack = { path = "../crates/foks-snowpack" }
foks-rpc = { path = "../crates/foks-rpc" }
foks-keystore = { path = "../crates/foks-keystore" }
foks-agent-proto = { path = "../crates/foks-agent-proto" }
foks-proto = { path = "../crates/foks-proto" }
foks-verify = { path = "../crates/foks-verify" }
chacha20poly1305 = "0.11"
sha2 = "0.11"

[[bin]]
name = "snowpack"
path = "fuzz_targets/snowpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc"
path = "fuzz_targets/rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_archive"
path = "fuzz_targets/state_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_rpc"
path = "fuzz_targets/server_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_frames"
path = "fuzz_targets/agent_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_schema"
path = "fuzz_targets/proto_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_arguments"
path = "fuzz_targets/server_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[test]]
name = "archive_scenarios"
path = "tests/archive_scenarios.rs"

[[test]]
name = "corpus_seeds"
path = "tests/corpus_seeds.rs"
