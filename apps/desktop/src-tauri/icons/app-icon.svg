<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>FOKS app icon</title>
  <desc>A white paw on alert orange, with a macOS rounded-square silhouette.</desc>
  <defs>
    <path id="tile" d="M330 100H694C846 100 924 178 924 330V694C924 846 846 924 694 924H330C178 924 100 846 100 694V330C100 178 178 100 330 100Z"/>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".46" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8f2d00" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#6f2600" flood-opacity=".25"/>
    </filter>
  </defs>
  <!-- Keep the base in sync with the alert token in kit/tokens.css. -->
  <use href="#tile" fill="#ff6f21" stroke="#c74400" stroke-width="2" filter="url(#tile-shadow)"/>
  <use href="#tile" fill="url(#surface)"/>
  <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="2" transform="translate(2 2) scale(.99609375)"/>
  <!-- Lucide paw-print, enlarged from its 24px coordinate system. -->
  <g transform="translate(272 272) scale(20)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="4" r="2"/>
    <circle cx="18" cy="8" r="2"/>
    <circle cx="20" cy="16" r="2"/>
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>
  </g>
</svg>
