# A member of the root workspace so one Cargo.lock covers the complete tree.
# Build it only where the platform webview toolchain exists.
[package]
name = "foks-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FOKS desktop client application."

[lib]
name = "foks_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "foks-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
foks-client-app = { workspace = true }
foks-keystore = { workspace = true }
foks-yubi = { workspace = true, features = ["hardware"] }
foks-agent-client = { workspace = true }
foks-agent-proto = { workspace = true }
foks-compat-artifact = { workspace = true }
foks-crypto = { workspace = true }
foks-desktop = { path = "../../../crates/foks-desktop", default-features = false }
foks-verify = { workspace = true }
foks-protocol-metadata = { workspace = true }
# FOKS has no menu bar presence and does not use macOS private APIs.
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chacha20poly1305 = { workspace = true }
fs2 = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# Reads the command signatures from source; see src/command_signatures.rs.
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# The clipboard plugin's arboard, used directly to set the history hint its
# write_text omits; see src/clipboard.rs.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotification", "UNNotificationResponse", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSPathUtilities", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "LAError", "LAPublicDefines", "block2", "std"] }

[lints]
workspace = true
